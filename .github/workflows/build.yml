name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Set default git branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - name: Check ToolShear DIY consistency
        run: python3 diy/toolshear_diy.py check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch PDFium
        run: native/fetch-pdfium.sh

      - name: Build native core
        run: native/build.sh

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: toolshear-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Prepare signing keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "IS_PR_BUILD=true" >> "$GITHUB_ENV"
            echo "KS_PASS=toolshear-pr" >> "$GITHUB_ENV"
            echo "KS_ALIAS=toolshear-pr" >> "$GITHUB_ENV"
            echo "K_PASS=toolshear-pr" >> "$GITHUB_ENV"
            keytool -genkeypair -v -keystore release.p12 -storetype PKCS12 \
              -storepass toolshear-pr -keypass toolshear-pr -alias toolshear-pr \
              -keyalg RSA -keysize 2048 -validity 365 -dname "CN=ToolShear PR"
            printf 'storeFile=release.p12\nstorePassword=toolshear-pr\nkeyAlias=toolshear-pr\nkeyPassword=toolshear-pr\n' > keystore.properties
          else
            if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Add KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to sign builds."
              exit 1
            fi
            echo "IS_PR_BUILD=false" >> "$GITHUB_ENV"
            {
              echo "KS_PASS<<EOF_KS"
              printf '%s\n' "$KEYSTORE_PASSWORD"
              echo "EOF_KS"
              echo "KS_ALIAS<<EOF_ALIAS"
              printf '%s\n' "$KEY_ALIAS"
              echo "EOF_ALIAS"
              echo "K_PASS<<EOF_KP"
              printf '%s\n' "$KEY_PASSWORD"
              echo "EOF_KP"
            } >> "$GITHUB_ENV"
            echo "$KEYSTORE" | base64 -d > release.p12
            printf 'storeFile=release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Build and verify signed APKs
        run: |
          version=$(grep '^toolshear.versionName=' gradle.properties | cut -d= -f2)
          ./gradlew --stacktrace :app:assembleRelease -Ptoolshear.splitApks=true -PisPrBuild="$IS_PR_BUILD"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            out="dist/ToolShear-v${version}-${abi}.apk"
            cp "$src" "$out"
            "$APKSIGNER" sign \
              --ks release.p12 \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KS_ALIAS" \
              --key-pass env:K_PASS \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              "$out"
            "$APKSIGNER" verify --verbose "$out"
          done
          if [ "$IS_PR_BUILD" = "false" ]; then
            python3 diy/toolshear_diy.py check --apk dist/*.apk
          fi
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: toolshear-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Upload ProGuard mappings
        uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up signing materials
        if: always()
        run: rm -f release.p12 keystore.properties
